# =============================================================================
# CI/CD — build image on GitHub, deploy to VPS
# =============================================================================
#
# Triggers:
#   - pull_request → verify only
#   - push to main/master → verify → push-image → deploy
#
# Deploy model:
#   Build runs on GitHub runners. VPS: git pull + ./deploy.sh (docker pull + up).
#
# Required GitHub secrets:
#   VPS_HOST, VPS_USERNAME, VPS_PASSWORD, VPS_PORT
#   VPS_DEPLOY_PATH (optional, default ~/obinwanne_farms/web)
#
# Optional repository variables (Next.js build args):
#   NEXT_PUBLIC_API_URL, INTERNAL_API_ORIGIN, NEXT_PUBLIC_COMPANY_*
# =============================================================================

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.obinwannefarms.com/api/v1
          INTERNAL_API_ORIGIN: http://host.docker.internal:6600
          NEXT_PUBLIC_COMPANY_ADDRESS: No. 30 Onuaguluchi Avenue, Ihe-Achi, Oji-River LGA, Enugu State, Nigeria
          NEXT_PUBLIC_COMPANY_PHONE: +234 8136570849
          NEXT_PUBLIC_COMPANY_BUSINESS_HOURS: Monday - Saturday, 7:00 AM - 6:00 PM (WAT)
          NEXT_PUBLIC_COMPANY_EMAIL: admin@obinwannefarms.com
          NEXT_PUBLIC_COMPANY_LATITUDE: "6.12837"
          NEXT_PUBLIC_COMPANY_LONGITUDE: "7.31018"

      - name: Prepare compose env
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.vps.yml config
          docker compose config

      - name: Build production image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.obinwannefarms.com/api/v1 \
            --build-arg INTERNAL_API_ORIGIN=http://host.docker.internal:6600 \
            --build-arg NEXT_PUBLIC_COMPANY_ADDRESS="No. 30 Onuaguluchi Avenue, Ihe-Achi, Oji-River LGA, Enugu State, Nigeria" \
            --build-arg NEXT_PUBLIC_COMPANY_PHONE="+234 8136570849" \
            --build-arg NEXT_PUBLIC_COMPANY_EMAIL=admin@obinwannefarms.com \
            --build-arg NEXT_PUBLIC_COMPANY_BUSINESS_HOURS="Monday - Saturday, 7:00 AM - 6:00 PM (WAT)" \
            --build-arg NEXT_PUBLIC_COMPANY_LATITUDE=6.12837 \
            --build-arg NEXT_PUBLIC_COMPANY_LONGITUDE=7.31018 \
            -t obinwanne-farms-web:test .

      - name: Ensure deploy scripts are executable
        run: chmod +x deploy.sh && test -x deploy.sh

  push-image:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve build args
        run: |
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.obinwannefarms.com/api/v1}" >> "$GITHUB_ENV"
          echo "INTERNAL_API_ORIGIN=${INTERNAL_API_ORIGIN:-http://host.docker.internal:6600}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COMPANY_ADDRESS=${NEXT_PUBLIC_COMPANY_ADDRESS:-No. 30 Onuaguluchi Avenue, Ihe-Achi, Oji-River LGA, Enugu State, Nigeria}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COMPANY_PHONE=${NEXT_PUBLIC_COMPANY_PHONE:-+234 8136570849}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COMPANY_EMAIL=${NEXT_PUBLIC_COMPANY_EMAIL:-admin@obinwannefarms.com}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COMPANY_BUSINESS_HOURS=${NEXT_PUBLIC_COMPANY_BUSINESS_HOURS:-Monday - Saturday, 7:00 AM - 6:00 PM (WAT)}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COMPANY_LATITUDE=${NEXT_PUBLIC_COMPANY_LATITUDE:-6.12837}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COMPANY_LONGITUDE=${NEXT_PUBLIC_COMPANY_LONGITUDE:-7.31018}" >> "$GITHUB_ENV"
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          INTERNAL_API_ORIGIN: ${{ vars.INTERNAL_API_ORIGIN }}
          NEXT_PUBLIC_COMPANY_ADDRESS: ${{ vars.NEXT_PUBLIC_COMPANY_ADDRESS }}
          NEXT_PUBLIC_COMPANY_PHONE: ${{ vars.NEXT_PUBLIC_COMPANY_PHONE }}
          NEXT_PUBLIC_COMPANY_EMAIL: ${{ vars.NEXT_PUBLIC_COMPANY_EMAIL }}
          NEXT_PUBLIC_COMPANY_BUSINESS_HOURS: ${{ vars.NEXT_PUBLIC_COMPANY_BUSINESS_HOURS }}
          NEXT_PUBLIC_COMPANY_LATITUDE: ${{ vars.NEXT_PUBLIC_COMPANY_LATITUDE }}
          NEXT_PUBLIC_COMPANY_LONGITUDE: ${{ vars.NEXT_PUBLIC_COMPANY_LONGITUDE }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            INTERNAL_API_ORIGIN=${{ env.INTERNAL_API_ORIGIN }}
            NEXT_PUBLIC_COMPANY_ADDRESS=${{ env.NEXT_PUBLIC_COMPANY_ADDRESS }}
            NEXT_PUBLIC_COMPANY_PHONE=${{ env.NEXT_PUBLIC_COMPANY_PHONE }}
            NEXT_PUBLIC_COMPANY_EMAIL=${{ env.NEXT_PUBLIC_COMPANY_EMAIL }}
            NEXT_PUBLIC_COMPANY_BUSINESS_HOURS=${{ env.NEXT_PUBLIC_COMPANY_BUSINESS_HOURS }}
            NEXT_PUBLIC_COMPANY_LATITUDE=${{ env.NEXT_PUBLIC_COMPANY_LATITUDE }}
            NEXT_PUBLIC_COMPANY_LONGITUDE=${{ env.NEXT_PUBLIC_COMPANY_LONGITUDE }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: push-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: obinwanne-farms-web-vps-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then DEPLOY_PATH="$HOME/obinwanne_farms/web"; fi
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Deploy directory not found: $DEPLOY_PATH"
              exit 1
            fi
            cd "$DEPLOY_PATH"
            git fetch origin
            git checkout "${{ github.ref_name }}"
            git pull origin "${{ github.ref_name }}"
            chmod +x ./deploy.sh
            echo "Logging in to ghcr.io for image pull..."
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export DEPLOY_BUILD_LOCAL=0
            export OBINWANNE_WEB_IMAGE="ghcr.io/${{ github.repository }}:latest"
            ./deploy.sh
