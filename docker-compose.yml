name: obinwanne-farms-web

services:
  web:
    image: obinwanne-farms-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - INTERNAL_API_ORIGIN=${INTERNAL_API_ORIGIN:-http://host.docker.internal:6600}
        - NEXT_PUBLIC_COMPANY_ADDRESS=${NEXT_PUBLIC_COMPANY_ADDRESS}
        - NEXT_PUBLIC_COMPANY_PHONE=${NEXT_PUBLIC_COMPANY_PHONE}
        - NEXT_PUBLIC_COMPANY_EMAIL=${NEXT_PUBLIC_COMPANY_EMAIL}
        - NEXT_PUBLIC_COMPANY_BUSINESS_HOURS=${NEXT_PUBLIC_COMPANY_BUSINESS_HOURS}
        - NEXT_PUBLIC_COMPANY_LATITUDE=${NEXT_PUBLIC_COMPANY_LATITUDE}
        - NEXT_PUBLIC_COMPANY_LONGITUDE=${NEXT_PUBLIC_COMPANY_LONGITUDE}
    container_name: obinwanne-farms-web
    ports:
      - "6601:6601"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://host.docker.internal:6600}
      NEXT_PUBLIC_COMPANY_ADDRESS: ${NEXT_PUBLIC_COMPANY_ADDRESS}
      NEXT_PUBLIC_COMPANY_PHONE: ${NEXT_PUBLIC_COMPANY_PHONE}
      NEXT_PUBLIC_COMPANY_EMAIL: ${NEXT_PUBLIC_COMPANY_EMAIL}
      NEXT_PUBLIC_COMPANY_BUSINESS_HOURS: ${NEXT_PUBLIC_COMPANY_BUSINESS_HOURS}
      NEXT_PUBLIC_COMPANY_LATITUDE: ${NEXT_PUBLIC_COMPANY_LATITUDE}
      NEXT_PUBLIC_COMPANY_LONGITUDE: ${NEXT_PUBLIC_COMPANY_LONGITUDE}
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - obinwanne-farms-network

networks:
  obinwanne-farms-network:
    driver: bridge
